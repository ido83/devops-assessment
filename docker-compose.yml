# SecAssess v15 — Docker Compose
# DB password is loaded from ./secrets/db_pass.txt (gitignored).
# Copy secrets/db_pass.txt.example → secrets/db_pass.txt and set a strong password.
# DB_NAME and DB_USER must be set in .env (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    container_name: secassess-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_pass
    secrets:
      - db_pass
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secassess-api
    environment:
      PORT: "4000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    secrets:
      - db_pass
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>r.json()).then(d=>{if(!d.ok)throw 1;process.exit(0)}).catch(()=>process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_GIT_SHA: ${GIT_SHA:-dev}
        REACT_APP_GIT_BRANCH: ${GIT_BRANCH:-main}
    container_name: secassess-app
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Security scan services ───────────────────────────────────────────────
  # Run individually: docker compose --profile scan run --rm <service>
  # Or via Makefile:  make scan-secrets | scan-sast | scan-vulns | scan-images | scan-dive | scan

  gitleaks:
    image: zricethezav/gitleaks:latest
    container_name: secassess-gitleaks
    volumes:
      - .:/repo:ro
    command: detect --source=/repo --verbose
    profiles: [scan]

  semgrep:
    image: semgrep/semgrep:latest
    container_name: secassess-semgrep
    volumes:
      - .:/src:ro
    working_dir: /src
    command: semgrep scan --config=auto --error --exclude=node_modules --exclude=build /src
    profiles: [scan]

  trivy-fs:
    image: aquasec/trivy:latest
    container_name: secassess-trivy-fs
    volumes:
      - .:/workspace:ro
      - trivy-cache:/root/.cache/trivy
    command: fs --scanners vuln,secret,misconfig /workspace
    profiles: [scan]

  trivy-backend:
    image: aquasec/trivy:latest
    container_name: secassess-trivy-backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - trivy-cache:/root/.cache/trivy
    command: image secassess-api
    profiles: [scan]

  trivy-frontend:
    image: aquasec/trivy:latest
    container_name: secassess-trivy-frontend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - trivy-cache:/root/.cache/trivy
    command: image secassess-app
    profiles: [scan]

  dive-backend:
    image: wagoodman/dive:latest
    container_name: secassess-dive-backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: secassess-api --ci
    profiles: [scan]

  dive-frontend:
    image: wagoodman/dive:latest
    container_name: secassess-dive-frontend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: secassess-app --ci
    profiles: [scan]

secrets:
  db_pass:
    file: ./secrets/db_pass.txt

volumes:
  pg-data:
    driver: local
  trivy-cache:
    driver: local
